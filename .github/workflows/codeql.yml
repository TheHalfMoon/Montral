name: Montral CodeQL code scanning
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  container-image-audit:
    name: Container image vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the source tree
        uses: actions/checkout@v4
      - name: Build the shipped images
        run: |
          docker build --file Dockerfile --tag montral-app:security-scan .
          docker build --file Dockerfile --target browser-runner --tag montral-browser-runner:security-scan .
          docker build --file apps/probe/Dockerfile --tag montral-probe:security-scan .
          docker build --file Dockerfile.postgres --tag montral-postgres:security-scan .
          docker pull postgres:18.7-alpine
      - name: Download Trivy 0.76.2 with a pinned checksum
        shell: bash
        run: |
          set -euo pipefail
          version="0.76.2"
          bundle="$RUNNER_TEMP/trivy_${version}_Linux-64bit.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --output "$bundle" \
            "https://github.com/aquasecurity/trivy/releases/download/v${version}/trivy_${version}_Linux-64bit.tar.gz"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $bundle" | sha256sum --check --status
          tar -xzf "$bundle" -C "$RUNNER_TEMP" trivy
          chmod +x "$RUNNER_TEMP/trivy"
          test "$("$RUNNER_TEMP/trivy" --version | awk '/^Version:/ { print $2 }')" = "$version"
      - name: Reject HIGH or CRITICAL findings in shipped images
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for image in \
            montral-app:security-scan \
            montral-browser-runner:security-scan \
            montral-probe:security-scan \
            montral-postgres:security-scan; do
            if ! "$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --timeout 20m "$image"; then
              status=1
            fi
          done
          exit "$status"
  go-dependency-audit:
    name: Go dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Go provider
        uses: actions/checkout@v4
      - name: Set up supported Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: terraform-provider-montral/go.sum
      - name: Check reachable Go vulnerabilities
        working-directory: terraform-provider-montral
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: go
            build-mode: autobuild
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Go for provider analysis
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: terraform-provider-montral/go.sum
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          # Fork pull requests have a read-only token, so skip the upload explicitly.
          upload: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
