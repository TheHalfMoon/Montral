name: Montral browser checks
# Browser (multi-step) monitors in real Chromium: the egress policy, runaway-page limits, concurrency cap and isolation
# against a synthetic local site, the API on real PostgreSQL, and the optional browser Docker image. Chromium comes from
# the Playwright version pinned in e2e/package.json; here a missing Chromium fails the tests instead of skipping them.
on:
  # main runs on push; branches run once, as the pull request
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  chromium:
    name: Browser checks in Chromium, egress policy and API (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TEST_DATABASE_URL: postgres://montral:montral-local-test@127.0.0.1:5432/montral_ci
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: montral_ci
          POSTGRES_USER: montral
          POSTGRES_PASSWORD: montral-local-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U montral -d montral_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Read the pinned Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./e2e/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system dependencies (pinned Playwright)
        working-directory: e2e
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright --version
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          for attempt in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium; then exit 0; fi
            echo "playwright install attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; Chromium's sandbox (on by default for
      # browser checks) needs them. Lifted for this disposable runner only, as a self-hoster's host would allow them.
      - name: Allow Chromium's sandbox (unprivileged user namespaces)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Build the browser-check worker bundle that ships
        run: pnpm --filter @montral/api build:browser-worker
      - name: Typecheck the API
        run: pnpm --filter @montral/api typecheck
      - name: Browser checks, egress policy, limits and API against PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER_CHECK_TESTS=required
          export BROWSER_WORKER_BUNDLE="$PWD/apps/api/dist/browser-worker.mjs"
          cd apps/api
          npx vitest run src/browser-check.integration.test.ts src/browser-check.e2e.test.ts src/browser-check.test.ts src/browser-egress.test.ts src/browser-steps.test.ts src/browser-secrets.test.ts src/browser-runner.test.ts src/browser-unchecked.test.ts src/browser-spot-check.test.ts src/guards/browser-runtime.test.ts --reporter=verbose

  runner:
    name: Hardened browser-runner stack (app + runner + PostgreSQL) runs a journey end to end
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Pull base images (retried)
        shell: bash
        run: |
          set -euo pipefail
          for image in postgres:18.6-alpine node:22.23.4-alpine node:22.23.4-bookworm-slim; do
            for attempt in 1 2 3 4 5; do
              docker pull -q "$image" && continue 2
              sleep $((attempt * 5))
            done
            echo "::error::could not pull $image"; exit 1
          done
      - name: Qualify app + browser-runner + PostgreSQL with docker-compose.browser.yml
        run: bash scripts/qualify-browser-runner.sh
