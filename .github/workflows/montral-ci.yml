name: Montral app CI
on:
  # main runs on push; branches run once, as the pull request (an extra push run tested the same commit twice)
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  monorepo:
    name: Typecheck, tests and production builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_DATABASE_URL: postgres://montral:montral-local-test@127.0.0.1:5432/montral_ci
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: montral_ci
          POSTGRES_USER: montral
          POSTGRES_PASSWORD: montral-local-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U montral -d montral_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: pnpm
      - name: Verify unchanged source snapshots
        run: python3 scripts/verify_sources.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typescript and Astro checks
        run: pnpm -r typecheck
      - name: PostgreSQL E2E, API and probe tests
        run: pnpm --filter @montral/api test && pnpm --filter @montral/probe test
      - name: Build Node API
        run: pnpm --filter @montral/api build:node
      - name: Build edge probe
        run: pnpm --filter @montral/probe build:edge
      - name: Build self-hosted Node web
        run: DEPLOY_TARGET=node pnpm --filter @montral/web build
      - name: Landing pages carry an up-to-date strict CSP
        run: node scripts/landing-csp.mjs --check
      - name: Every inline script on built pages is allowed by its page's CSP hash
        run: node scripts/verify-csp-hashes.mjs apps/web/dist/client
      - name: Web tests with built production routes
        run: pnpm --filter @montral/web test
      - name: Smoke-test running Node API and web against PostgreSQL
        run: node scripts/smoke-node.mjs
      # Ubuntu runner images may ship pg_dump 16 while the service is PostgreSQL
      # 17. PostgreSQL refuses a major-version-older pg_dump, so install the
      # version-matched client before testing the actual full-content restore.
      # This never touches production DBs; the drill creates/drops test DBs.
      - name: Install PostgreSQL 17 backup client
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error --location --retry 3 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client-17
          # Explicit binaries avoid accidentally invoking the image's v16 tools.
          test -x /usr/lib/postgresql/17/bin/pg_dump
          test -x /usr/lib/postgresql/17/bin/pg_restore
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Qualify full-table PostgreSQL backup and content restore
        shell: bash
        run: |
          set -euo pipefail
          restore_db="${TEST_DATABASE_URL%/*}/montral_test_restore_ci"
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE montral_test_restore_ci'
          trap 'psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS montral_test_restore_ci WITH (FORCE)"' EXIT
          TEST_DATABASE_URL="$restore_db" node scripts/smoke-node.mjs
          psql "$restore_db" -X -v ON_ERROR_STOP=1 -c "
            INSERT INTO organization (id,name,slug,created_at)
              SELECT 'restore-ci-' || i, 'Synthetic CI restore ' || i, 'restore-ci-' || i, now()
              FROM generate_series(1,8) i;
            INSERT INTO project (organization_id,name)
              SELECT id, 'Synthetic CI project' FROM organization;
            INSERT INTO monitor (organization_id,project_id,name,type,target)
              SELECT p.organization_id,p.id,'Synthetic CI heartbeat','heartbeat','synthetic-only' FROM project p;
          "
          TEST_DATABASE_URL="$restore_db" node scripts/qualify-backup.mjs
          # Deliberately corrupt only a fresh disposable restore. A data-only
          # verifier used to accept a disabled monthly-content trigger.
          TEST_DATABASE_URL="$restore_db" node scripts/qualify-backup-negative.mjs
      - name: Qualify real Chromium user journeys against disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser" ]]; then
            echo "Chrome/Chromium not installed on runner; browser qualification cannot pass"
            exit 1
          fi
          browser_db="${TEST_DATABASE_URL%/*}/montral_test_browser_ci"
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE montral_test_browser_ci'
          trap 'psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS montral_test_browser_ci WITH (FORCE)"' EXIT
          MONTRAL_CHROMIUM="$browser" TEST_DATABASE_URL="$browser_db" node scripts/qualify-browser.mjs
      # SIGTERM success says nothing about SIGKILL or database loss: qualify
      # those separately against a real Node process and disposable database.
      - name: Qualify SIGKILL, database outage and two-worker recovery
        shell: bash
        run: |
          set -euo pipefail
          crash_db="${TEST_DATABASE_URL%/*}/montral_test_crash_ci"
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE montral_test_crash_ci'
          trap 'psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS montral_test_crash_ci WITH (FORCE)"' EXIT
          TEST_DATABASE_URL="$crash_db" node scripts/qualify-crash-recovery.mjs
      - name: Qualify automatic incident and SMTP alert delivery to local sink
        run: node scripts/qualify-smtp.mjs
      - name: Qualify Node SMTP failure log privacy with synthetic local peer
        run: node scripts/qualify-smtp-error-log.mjs
      - name: No source brand leaks in active code
        run: bash scripts/verify-active-branding.sh
