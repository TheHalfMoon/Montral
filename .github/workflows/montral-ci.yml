name: Montral app CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  monorepo:
    name: Typecheck, tests and production builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: pnpm
      - name: Verify unchanged source snapshots
        run: python3 scripts/verify_sources.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typescript and Astro checks
        run: pnpm -r typecheck
      - name: All API, web and probe tests
        run: pnpm --filter @montral/api test && pnpm --filter @montral/web test && pnpm --filter @montral/probe test
      - name: Build Node API
        run: pnpm --filter @montral/api build:node
      - name: Build edge probe
        run: pnpm --filter @montral/probe build:edge
      - name: Build web
        run: pnpm --filter @montral/web build
      - name: No source brand leaks in active code
        run: |
          if grep -R -i -E 'openuptime|uptimeflare|webhook.site' apps packages --include='*.ts' --include='*.tsx' --include='*.astro' --include='*.json' --exclude-dir=dist --exclude-dir=.astro --exclude-dir=node_modules | head -n 1; then
            echo "Unexpected upstream product branding in active code"
            exit 1
          fi
