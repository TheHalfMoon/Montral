name: Montral Docker Compose qualification
# Builds the Dockerfile image and runs the shipped docker-compose.yml (pinned PostgreSQL) exactly as a self-hoster
# would, on disposable containers with synthetic secrets. Never pushes or publishes an image.
on:
  # main runs on push; branches run once, as the pull request (an extra push run tested the same commit twice)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  compose:
    name: Image build, compose stack, persistence and downgrade refusal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pull base images (retried)
        shell: bash
        run: |
          set -euo pipefail
          for image in postgres:18.6-alpine postgres:17-alpine node:22.23.4-alpine; do
            for attempt in 1 2 3 4 5; do
              docker pull -q "$image" && continue 2
              sleep $((attempt * 5))
            done
            echo "::error::could not pull $image"; exit 1
          done
      - name: Qualify the Docker Compose stack
        run: bash scripts/qualify-docker.sh

  replicas:
    name: Two app replicas behind a load balancer, rolling restart, no duplicate checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pull base images (retried)
        shell: bash
        run: |
          set -euo pipefail
          for image in postgres:18.6-alpine node:22.23.4-alpine nginx:1.28.0-alpine; do
            for attempt in 1 2 3 4 5; do
              docker pull -q "$image" && continue 2
              sleep $((attempt * 5))
            done
            echo "::error::could not pull $image"; exit 1
          done
      - name: Qualify replicas behind the load balancer
        run: bash scripts/qualify-replicas.sh
