name: Montral Terraform provider
# Builds, vets and unit-tests terraform-provider-montral/, then runs its acceptance tests (TF_ACC=1) against the
# self-hosted Node server and a disposable PostgreSQL database on the runner. Synthetic user, workspace and API key
# only; nothing is published (no registry upload, tags or releases).
on:
  # main runs on push; branches run once, as the pull request (an extra push run tested the same commit twice)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  provider:
    name: Provider build, unit and acceptance tests (Terraform 1.17.1, PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_DATABASE_URL: postgres://montral:montral-local-test@127.0.0.1:5432/montral_ci
      GOTOOLCHAIN: local
      CHECKPOINT_DISABLE: "1"
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: montral_ci
          POSTGRES_USER: montral
          POSTGRES_PASSWORD: montral-local-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U montral -d montral_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: terraform-provider-montral/go.sum
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: Go module is tidy and formatted
        working-directory: terraform-provider-montral
        run: |
          go mod verify
          go mod tidy -diff
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt needed"; exit 1; }
      - name: Build provider
        working-directory: terraform-provider-montral
        run: go build -trimpath -o "$RUNNER_TEMP/terraform-provider-montral" .
      - name: go vet
        working-directory: terraform-provider-montral
        run: go vet ./...
      - name: Unit tests (acceptance tests skip without TF_ACC)
        working-directory: terraform-provider-montral
        run: go test ./... -count=1
      - name: Examples are valid HCL for this provider
        working-directory: terraform-provider-montral
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/dev.tfrc" <<EOF
          provider_installation {
            dev_overrides {
              "registry.terraform.io/thehalfmoon/montral" = "$RUNNER_TEMP"
            }
            direct {}
          }
          EOF
          export TF_CLI_CONFIG_FILE="$RUNNER_TEMP/dev.tfrc"
          for dir in $(find examples -name '*.tf' -exec dirname {} \; | sort -u); do
            echo "validate $dir"
            terraform -chdir="$dir" validate -no-color
          done
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Node API
        run: pnpm --filter @montral/api build:node
      - name: Build self-hosted Node web
        run: DEPLOY_TARGET=node pnpm --filter @montral/web build
      - name: Acceptance tests against Node server and disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          tf_db="${TEST_DATABASE_URL%/*}/montral_test_tf_ci"
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE montral_test_tf_ci'
          trap 'psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS montral_test_tf_ci WITH (FORCE)"' EXIT
          TEST_DATABASE_URL="$tf_db" node scripts/qualify-terraform.mjs
