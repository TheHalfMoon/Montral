name: Montral source integrity
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  montral-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Montral-only source tree
        run: python3 scripts/verify_sources.py
      - name: Verify active Montral branding
        run: bash scripts/verify-active-branding.sh
      - name: Verify no external font loads
        run: |
          node scripts/verify-no-remote-fonts.mjs --negative-control
          node scripts/landing-csp.mjs --check
      - name: Test exact-main qualification evidence guard
        run: python3 -m unittest discover -s scripts -p test_verify_main_workflows.py
      - name: Prepare free pnpm advisory audit (no package installation)
        uses: pnpm/action-setup@v4
        with:
          version: "10.0.0"
          run_install: false
      - name: Prepare supported Node.js for advisory audit
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Enforce high/critical production-lock advisory gate
        run: |
          node --test scripts/verify-dependency-advisories.test.mjs
          node scripts/verify-dependency-advisories.mjs
      - name: Download verified Gitleaks 8.30.1 from its public release
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --output "$bundle" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $bundle" | sha256sum --check --status
          tar -xzf "$bundle" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          test "$("$RUNNER_TEMP/gitleaks" version)" = "8.30.1"
      - name: Block new secrets with exact-line fixture review
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: |
          node --test scripts/verify-secret-scanner.test.mjs
          node scripts/verify-secret-scanner.mjs
      - name: Reject newly committed secrets after archived source baseline
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: |
          node --test scripts/verify-secret-history.test.mjs
          node scripts/verify-secret-history.mjs
      - name: Verify Montral license
        run: |
          test -s LICENSE
