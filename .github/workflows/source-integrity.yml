name: Montral source integrity
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  montral-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Montral-only source tree
        run: python3 scripts/verify_sources.py
      - name: Verify active Montral branding
        run: bash scripts/verify-active-branding.sh
      - name: Verify no external font loads
        run: |
          node scripts/verify-no-remote-fonts.mjs --negative-control
          node scripts/landing-csp.mjs --check
      - name: Verify Montral license
        run: |
          test -s LICENSE
