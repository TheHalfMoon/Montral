<html lang="en">
<head>
<meta charset="utf-8">

@font-face{font-family:"Newsreader";font-weight:200 800;src:url(../public/fonts/newsreader-latin.woff2) format("woff2")}

.lock b{font:600 104px/1 "Newsreader",serif;letter-spacing:-.035em}
h1{font:500 74px/1 "Newsreader",serif;letter-spacing:-.03em;margin:0}
.foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:17px;color:#56554E;font-weight:500}
.foot span{display:flex;gap:18px}
