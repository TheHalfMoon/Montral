# Several app replicas behind one load balancer, sharing one PostgreSQL. Use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.replicas.yml up -d --build
# The replicas need no coordination of their own: checks, escalations, deliveries and maintenance are claimed in
# PostgreSQL, sessions live in PostgreSQL, and every replica serves the same web app. Scale with REPLICAS (default 2).
# Qualified in CI by scripts/qualify-replicas.sh (rolling restarts, no duplicate checks, single incidents).
services:
  montral:
    # only the load balancer publishes a port; the replicas are reached through it
    ports: !reset []
    deploy:
      replicas: ${REPLICAS:-2}
    environment:
      # exactly one reverse proxy (the load balancer below) is in front: its X-Forwarded-For feeds the rate limits
      TRUST_PROXY: "true"
  lb:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    depends_on:
      montral: { condition: service_started }
    ports: ["${PORT:-8080}:8080"]
    volumes:
      - ./docker/lb-nginx.conf:/etc/nginx/conf.d/default.conf:ro
