# docker compose up -d   →   http://localhost:8080
services:
  montral:
    # build from source by default; to use a published image set MONTRAL_IMAGE and run `docker compose pull`
    image: ${MONTRAL_IMAGE:-montral:local}
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["${PORT:-8080}:8080"]
    # Ping monitors use BusyBox ping with unprivileged ICMP sockets. Docker 20.10+ already allows them in every container;
    # on an older engine or another runtime, uncomment (not compatible with network_mode: host).
    # sysctls:
    #   net.ipv4.ping_group_range: "0 2147483647"
    environment:
      DATABASE_URL: postgres://montral:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/montral
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -hex 32)}
      # public origin users open in the browser (used for cookies and links in emails)
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:8080}
      WEB_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      # optional: outgoing email (invitations, password reset, alerts). Without it emails are written to the log.
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # optional: close registration once your own account exists (invited people can still join)
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-}
      INVITE_TTL_DAYS: ${INVITE_TTL_DAYS:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
      # "true" when exactly one reverse proxy is in front: its X-Forwarded-For feeds the rate limits
      TRUST_PROXY: ${TRUST_PROXY:-}
      TRUST_PROXY_PEER_IPS: ${TRUST_PROXY_PEER_IPS:-}
      # optional: Cloudflare Turnstile on email sign-up (set both)
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      LEGAL_LINKS: ${LEGAL_LINKS:-}
      # optional: lets an external scheduler call POST /internal/run-checks; unset keeps /internal/* closed
      CRON_SECRET: ${CRON_SECRET:-}
      # "true" lets monitors and alert webhooks target private / internal addresses (127.x, 10.x, 192.168.x, compose service names)
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-}
      # "true" lets webhook replay reach private development endpoints (never link-local / metadata addresses).
      # Separate from ALLOW_PRIVATE_TARGETS because replay returns response bodies to the user.
      MONTRAL_REPLAY_PRIVATE_TARGETS: ${MONTRAL_REPLAY_PRIVATE_TARGETS:-}
      # Browser (multi-step) checks run in the separate, hardened browser-runner service:
      # docker compose -f docker-compose.yml -f docker-compose.browser.yml up -d --build. See /docs/self-host#browser-checks.
      BROWSER_CHECKS: ${BROWSER_CHECKS:-}
      BROWSER_RUNNER_URL: ${BROWSER_RUNNER_URL:-}
      BROWSER_RUNNER_TOKEN: ${BROWSER_RUNNER_TOKEN:-}
      BROWSER_CHECK_ALLOW_PRIVATE_TARGETS: ${BROWSER_CHECK_ALLOW_PRIVATE_TARGETS:-}
      MAX_BROWSER_CHECKS: ${MAX_BROWSER_CHECKS:-}
      BROWSER_CHECK_MAX_RSS_MB: ${BROWSER_CHECK_MAX_RSS_MB:-}
      BROWSER_EXECUTABLE_PATH: ${BROWSER_EXECUTABLE_PATH:-}
      # development only (NODE_ENV=development); refused otherwise
      BROWSER_CHECK_SANDBOX: ${BROWSER_CHECK_SANDBOX:-}
      # User-Agent of HTTP checks (default: Montral/0.1 (+https://github.com/TheHalfMoon/Montral))
      CHECK_USER_AGENT: ${CHECK_USER_AGENT:-}
      # reference URLs of the offline self-check; unset = defaults, set but empty = self-check off (no colon on purpose)
      SELFCHECK_URLS: ${SELFCHECK_URLS-https://www.cloudflare.com/cdn-cgi/trace,https://www.gstatic.com/generate_204,https://www.apple.com/library/test/success.html}
      # remote probes for multi-region checks (apps/probe): JSON of region id -> URL, and the secret both sides share
      PROBE_REGIONS: ${PROBE_REGIONS:-}
      PROBE_SECRET: ${PROBE_SECRET:-}
      # Optional dedicated signing keys by region, stored only in private deployment secrets.
      PROBE_SECRETS: ${PROBE_SECRETS:-}
      # iOS push notifications (APNs); all four needed, see /docs/self-host#apns
      APNS_KEY: ${APNS_KEY:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      # target of the "Powered by" link on status pages
      PRODUCT_URL: ${PRODUCT_URL:-https://montral.invalid}
      # max connections of the shared Postgres pool (default 10)
      DB_POOL_MAX: ${DB_POOL_MAX:-}
      # Node heap limit. 512 MB old space is the qualified configuration (scripts/qualify-load.mjs, 4,000 monitors);
      # without a limit Node sizes the heap from host RAM and may hold over 1 GB of collectable garbage. Raise it for
      # larger installations, keeping it at about 75% of the container's memory limit.
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=512}
      BIND_HOST: ${BIND_HOST:-}
      # Explicitly opt in to provider TEST-MODE only; leave blank for the default OFF.
      MONTRAL_METERING_ENABLED: ${MONTRAL_METERING_ENABLED:-}
      # operator plan catalog (path inside the container: mount the file read-only), or the document itself
      MONTRAL_PLAN_CONFIG: ${MONTRAL_PLAN_CONFIG:-}
      MONTRAL_PLAN_CONFIG_JSON: ${MONTRAL_PLAN_CONFIG_JSON:-}
      # Staged owner review, never active by default or as part of billing.
      MONTRAL_RECONCILIATION_ENABLED: ${MONTRAL_RECONCILIATION_ENABLED:-false}
      # Explicit emergency pause for NEW monthly report claims only.
      MONTRAL_MONTHLY_REPORTS_PAUSED: ${MONTRAL_MONTHLY_REPORTS_PAUSED:-false}
      # Platform operators (docs/OPERATOR.md); empty = none.
      MONTRAL_OPERATOR_USER_IDS: ${MONTRAL_OPERATOR_USER_IDS:-}
      MONTRAL_BILLING_ENABLED: ${MONTRAL_BILLING_ENABLED:-}
      MONTRAL_BILLING_MODE: ${MONTRAL_BILLING_MODE:-}
      LEMONSQUEEZY_API_KEY: ${LEMONSQUEEZY_API_KEY:-}
      LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET:-}
      LEMONSQUEEZY_STORE_ID: ${LEMONSQUEEZY_STORE_ID:-}
      LEMONSQUEEZY_VARIANT_PRO: ${LEMONSQUEEZY_VARIANT_PRO:-}
      LEMONSQUEEZY_VARIANT_BUSINESS: ${LEMONSQUEEZY_VARIANT_BUSINESS:-}
      MONTRAL_BILLING_GRACE_DAYS: ${MONTRAL_BILLING_GRACE_DAYS:-}
      MONTRAL_BILLING_SHOW_PRICES: ${MONTRAL_BILLING_SHOW_PRICES:-false}
      # optional: Plausible analytics (PLAUSIBLE_SRC defaults to https://plausible.io/js/script.js)
      PLAUSIBLE_DOMAIN: ${PLAUSIBLE_DOMAIN:-}
      PLAUSIBLE_SRC: ${PLAUSIBLE_SRC:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # optional instance-wide single sign-on (OpenID Connect); workspaces can also add their own under Settings
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      # identity provider on a private network or plain http (refused by default)
      SSO_ALLOW_PRIVATE_IDP: ${SSO_ALLOW_PRIVATE_IDP:-}

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: montral
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: montral
      # PostgreSQL 18's own default, spelled out so it cannot drift: an image of another major version (say someone
      # changes the tag to 17) then finds this 18 cluster and refuses to start ("database files are incompatible"),
      # instead of quietly initialising a new, empty cluster next to your data. Move between majors with a dump
      # and restore (see /docs/backup), never by changing the tag.
      PGDATA: /var/lib/postgresql/18/docker
    # PostgreSQL 18 images keep PGDATA in a versioned subdirectory, so mount the parent
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U montral"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
