# Load balancer for docker-compose.replicas.yml: round robin over every replica of the `montral` service.
# Docker's DNS (127.0.0.11) lists one address per running replica; `resolve` re-reads it, so a restarted or rescaled
# replica is picked up and a stopped one dropped. Only a connection that could not be made is retried on another
# replica (the request was never sent, so this is safe for every method); an answer from the app, even a 502/503, is
# passed on as is, so nothing is ever sent twice.
#
# TLS: terminate it here (add a `listen 443 ssl` server) or in a proxy in front. With a proxy in front, believe only
# its X-Forwarded-For, or every client looks like that proxy:
#   set_real_ip_from <front proxy address>;
#   real_ip_header X-Forwarded-For;
resolver 127.0.0.11 valid=5s ipv6=off;

upstream montral {
  zone montral 64k;
  server montral:8080 resolve max_fails=1 fail_timeout=5s;
}

server {
  listen 8080;
  # above the largest request the app accepts (monitor import: 4 MiB), so the app's own limits answer
  client_max_body_size 5m;

  location / {
    proxy_pass http://montral;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    # one hop: replace whatever the client sent with the address nginx saw
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;
    # which replica answered (an internal address): used by the qualification; remove the line if you prefer not to show it
    add_header X-Montral-Upstream $upstream_addr always;
  }
}
