# Load balancer for docker-compose.replicas.yml: round robin over every replica of the `montral` service.
# Docker's DNS (127.0.0.11) lists one address per running replica; `resolve` re-reads it, so a restarted or rescaled
# replica is picked up and a stopped one dropped. A refused connection is retried once on another replica (requests
# not yet sent, so this is safe for POST too). Put TLS in front of this, or terminate it here, for a public address.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream montral {
  zone montral 64k;
  server montral:8080 resolve max_fails=1 fail_timeout=5s;
}

server {
  listen 8080;
  client_max_body_size 2m;

  location / {
    proxy_pass http://montral;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;
    # which replica answered, for the qualification and for debugging; holds no secret
    add_header X-Montral-Upstream $upstream_addr always;
  }
}
